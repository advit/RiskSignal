[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risksignal"
version = "0.1.0"
description = "Domain-agnostic risk intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
